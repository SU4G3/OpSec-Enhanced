name: Feature request
description: Suggest an idea for OpSec Enhanced
title: "[SUGGESTION] "
labels: ["enhancement", "status: needs-triage"]
assignees:
  - SU4G3
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues](https://github.com/SU4G3/OpSec-Enhanced/issues) and the README first — the feature may already exist or be planned.

        **Never paste tokens, account data, IPs or proxy credentials.**

        > [!WARNING]
        > If you found a **privacy leak** (the mod fails to hide something it claims to hide), report it privately via a [Security Advisory](https://github.com/SU4G3/OpSec-Enhanced/security/advisories/new) instead.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: "Ex. I'm always frustrated when [...]"
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related area
      multiple: true
      options:
        - Client Spoofer / Spoof As (Lunar / Badlion)
        - Channel Spoofing / Known-Pack Filtering
        - Isolate Pack Cache / Per-Server Isolation / Auto-Purge
        - Block Local URLs / Scrub Pack Download Headers
        - Bypass Server Pack Requirement / Strip Mod Shader Overrides
        - Key Resolution Protection / Meteor Fix
        - Mod Whitelist
        - Chat Signing Control
        - Chat Link/Command Guard / Command History Guard
        - Account Manager
        - Telemetry Blocking / Block Cookies / Client Information Normalizer
        - Lazy Server List Ping / Cloudflare Ping Relay
        - Game Connection Proxy / DPI Evasion (TLS Fragmentation)
        - Streamer Mode
        - Settings screen / HUD indicator
        - New feature / not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Other mods, workarounds, or different approaches.
    validations:
      required: false

  - type: dropdown
    id: loader
    attributes:
      label: Target loader
      multiple: true
      options:
        - Fabric
        - NeoForge
        - Both / loader-agnostic
    validations:
      required: false

  - type: input
    id: mc_version
    attributes:
      label: Target Minecraft version(s)
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Privacy / compatibility notes
      description: What does this protect against? Could it break servers or other mods?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, examples from other mods.
    validations:
      required: false
